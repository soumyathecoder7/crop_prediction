<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgriPredictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body {
      /* Updated background URL with correct quoting */
      background: url("{{ url_for('static', filename='file_000000001fd071fab3d16552f86b681c.png') }}") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Quicksand', sans-serif;
    }

    /* Tab Navigation */
    .tab-nav {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      width: 95%;
      z-index: 10;
    }
    .tab-nav h2 {
      color: #ffeb3b;
      margin: 0;
      font-family: 'Baloo 2', cursive;
      font-size: 24px;
    }
    .tab-nav .tab-buttons {
      display: flex;
      align-items: center;
    }
    .tab-nav button, .tab-nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      margin-left: 20px;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s ease-in-out;
    }
    .tab-nav button:hover, .tab-nav a:hover {
      color: #ffeb3b;
    }
    .tab-nav button.active {
      color: #ffeb3b;
      border-bottom: 2px solid #ffeb3b;
    }

    /* Content Area */
    .tab-content {
      display: none;
      margin: 100px auto 0 auto;
      max-width: 500px;
      width: 100%;
    }
    .tab-content.active {
      display: block;
    }
    .login {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
    }
    .login h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 36px;
      color: #ffeb3b;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    /* Form Elements */
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background-color: #f1f1f1;
      color: #333;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: 2px solid #ffc107;
    }
    button[type="submit"] {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 15px 20px;
      margin-top: 20px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    button[type="submit"]:hover {
      background-color: #388e3c;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Results & Messages */
    #result, #soilResult {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      display: none;
      color: white; 
    }
    .result-success { background-color: rgba(76, 175, 80, 0.9); border: 2px solid #4caf50; }
    .result-warning { background-color: rgba(255, 235, 59, 0.9); color: #333 !important; border: 2px solid #ffeb3b; }
    .result-error { background-color: rgba(244, 67, 54, 0.9); border: 2px solid #f44336; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }
    .close-btn {
      background-color: #ffeb3b;
      color: #333;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Map */
    #soilMap {
      height: 300px;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }
    
    /* Loading Spinner */
    .loading {
      display: none;
      margin: 10px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4caf50;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* AI Chatbox Styles */
    #aiChatBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #4caf50;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10001;
      transition: transform 0.3s;
    }
    #aiChatBtn:hover { transform: scale(1.1); }

    #aiChatBox {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 450px;
      background: white;
      border-radius: 15px;
      display: none;
      flex-direction: column;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      overflow: hidden;
      z-index: 10000;
      font-family: 'Quicksand', sans-serif;
    }

    #aiChatHeader {
      background: #4caf50;
      color: white;
      padding: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #aiMessages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.4;
    }
    .user-msg { background: #e8f5e9; align-self: flex-end; color: #333; }
    .ai-msg { background: #fff; border: 1px solid #ddd; align-self: flex-start; color: #333; }
    
    #aiInputArea {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }
    #aiInput {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      margin: 0 10px 0 0;
    }
    #aiSendBtn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="tab-nav">
    <h2>AgriPredictor</h2>
    <div class="tab-buttons">
      <button class="tab-button active" onclick="openTab('crop')">Crop Recommendation</button>
      <button class="tab-button" onclick="openTab('soil')">Fertilizer Prediction</button>
      <a href="/report">View Reports</a>
    </div>
  </div>

  <div id="crop" class="tab-content active">
    <div class="login">
      <h1>Crop Recommendation</h1>
      
      {% if prediction_text %}
        <div id="result" class="{% if 'Error' in prediction_text %}result-error{% else %}result-success{% endif %}" style="display:block;">
          {{ prediction_text }}
        </div>
      {% endif %}

      <form id="predictionForm" method="POST" action="/predict">
        <input type="number" name="Nitrogen" placeholder="Nitrogen (0-140)" min="0" max="140" step="1" required />
        <input type="number" name="Phosphorus" placeholder="Phosphorus (0-145)" min="0" max="145" step="1" required />
        <input type="number" name="Potassium" placeholder="Potassium (0-205)" min="0" max="205" step="1" required />
        <input type="number" name="temperature" placeholder="Temperature (°C 0-50)" min="0" max="50" step="0.1" required />
        <input type="number" name="humidity" placeholder="Humidity (% 0-100)" min="0" max="100" step="0.1" required />
        <input type="number" name="pH" placeholder="pH (0-14)" min="0" max="14" step="0.1" required />
        <input type="number" name="rainfall" placeholder="Rainfall (mm 0-300)" min="0" max="300" step="0.1" required />
        <button type="submit" id="submitBtn">Predict Crop</button>
        <div class="loading" id="loading"></div>
      </form>
    </div>
  </div>

  <div id="soil" class="tab-content">
    <div class="login">
      <h1>Fertilizer Prediction</h1>
      <form id="soilPredictionForm">
        <label for="location" style="color:#ffeb3b; display:block; text-align:left; margin-bottom:5px;">Location:</label>
        <input type="text" id="location" name="location" placeholder="e.g., Mumbai, Maharashtra" required>
        
        <label for="cropSelect" style="color:#ffeb3b; display:block; text-align:left; margin-bottom:5px;">Select Crop:</label>
        <select id="cropSelect" name="crop">
          <option value="rice">Rice</option>
          <option value="wheat">Wheat</option>
          <option value="sugarcane">Sugarcane</option>
          <option value="millet">Millet</option>
          <option value="cotton">Cotton</option>
          <option value="pulses">Pulses</option>
          <option value="maize">Maize</option>
          <option value="potato">Potato</option>
        </select>
        <button type="submit" id="soilSubmitBtn">Predict Fertilizer</button>
        <div class="loading" id="soilLoading"></div>
      </form>
      <div id="soilResult"></div>
      <div id="soilMap"></div>
    </div>
  </div>

  <div id="predictionModal" class="modal">
    <div class="modal-content">
      <h2>Result</h2>
      <p id="predictionText">
        {% if prediction_text %}
          {{ prediction_text }}
        {% else %}
          Processing...
        {% endif %}
      </p>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <div id="aiChatBtn" onclick="toggleAIChat()">💬</div>
  <div id="aiChatBox">
    <div id="aiChatHeader">
      <span>🌱 Agri-Assistant</span>
      <span style="cursor:pointer;" onclick="toggleAIChat()">✖</span>
    </div>
    <div id="aiMessages">
      <div class="message ai-msg">Hello! Ask me about crops, fertilizers, or soil.</div>
    </div>
    <div id="aiInputArea">
      <input type="text" id="aiInput" placeholder="Type a message..." />
      <button id="aiSendBtn" onclick="sendAIMessage()">Send</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // --- 1. Tab Switching Logic ---
    function openTab(tabName) {
      const tabs = document.getElementsByClassName('tab-content');
      for (let i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      const buttons = document.getElementsByClassName('tab-button');
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
      }
      document.getElementById(tabName).classList.add('active');
      event.currentTarget.classList.add('active');
      
      // Fix map rendering if switching to soil tab
      if (tabName === 'soil' && typeof map !== 'undefined' && map) {
        setTimeout(() => map.invalidateSize(), 100);
      }
    }

    // --- 2. Modal Logic ---
    function closeModal() {
      document.getElementById('predictionModal').style.display = 'none';
    }

    function showModal(text = null) {
      const modal = document.getElementById('predictionModal');
      const pText = document.getElementById('predictionText');
      if (text) pText.textContent = text;
      
      if (pText.textContent.trim() !== '' && pText.textContent !== 'Processing...') {
        modal.style.display = 'flex';
      }
    }

    // --- 3. Crop Form Handling ---
    document.addEventListener('DOMContentLoaded', function() {
      // Check if flask passed a prediction text (page reload after submit)
      const resultDiv = document.getElementById('result');
      if (resultDiv && resultDiv.textContent.trim() !== '') {
        showModal(resultDiv.textContent);
      }
    });

    document.getElementById('predictionForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Predicting...';
      document.getElementById('loading').style.display = 'block';
    });

    // --- 4. Soil Prediction Logic ---
    const cropData = {
      rice: { optimalPhMin: 5.0, optimalPhMax: 7.0, fertilizers: ["Urea", "DAP", "Organic manure"] },
      wheat: { optimalPhMin: 6.0, optimalPhMax: 7.5, fertilizers: ["Urea", "SSP", "MOP"] },
      sugarcane: { optimalPhMin: 6.0, optimalPhMax: 8.0, fertilizers: ["Urea", "DAP", "Farmyard manure"] },
      millet: { optimalPhMin: 6.0, optimalPhMax: 7.5, fertilizers: ["Urea", "SSP", "Compost"] },
      cotton: { optimalPhMin: 5.5, optimalPhMax: 7.5, fertilizers: ["Urea", "DAP", "MOP"] },
      pulses: { optimalPhMin: 6.0, optimalPhMax: 7.5, fertilizers: ["DAP", "Rhizobium", "Manure"] },
      maize: { optimalPhMin: 5.5, optimalPhMax: 7.5, fertilizers: ["Urea", "DAP", "MOP"] },
      potato: { optimalPhMin: 5.0, optimalPhMax: 6.5, fertilizers: ["Urea", "DAP", "Potassium Sulfate"] }
    };

    let map;

    document.getElementById('soilPredictionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const location = document.getElementById('location').value.trim();
      const crop = document.getElementById('cropSelect').value;
      const resultDiv = document.getElementById('soilResult');
      const submitBtn = document.getElementById('soilSubmitBtn');
      const loading = document.getElementById('soilLoading');
      const soilMapDiv = document.getElementById('soilMap');

      // Reset UI
      submitBtn.disabled = true;
      submitBtn.textContent = 'Predicting...';
      loading.style.display = 'block';
      soilMapDiv.style.display = 'none';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch('/india_soil_fertilizer'); // Ensure this route exists in Flask
        if (!response.ok) throw new Error("Network error");
        
        const data = await response.json();
        
        // Find location match
        const locationData = data.find(item => 
          item.location.toLowerCase().includes(location.toLowerCase()) && 
          item.crop.toLowerCase() === crop.toLowerCase()
        );

        if (!locationData) {
          resultDiv.innerHTML = `<p class="result-error">No data found for "${location}". Try a major city/state.</p>`;
          resultDiv.style.display = 'block';
          return;
        }

        // Logic for recommendation
        const { latitude, longitude, soil_pH, fertilizers } = locationData;
        const cropInfo = cropData[crop];
        const isPhOptimal = soil_pH >= cropInfo.optimalPhMin && soil_pH <= cropInfo.optimalPhMax;

        let recommendation = isPhOptimal 
            ? `Soil pH (${soil_pH.toFixed(1)}) is optimal. ` 
            : `Soil pH (${soil_pH.toFixed(1)}) needs adjustment (Target: ${cropInfo.optimalPhMin}-${cropInfo.optimalPhMax}). `;
        
        recommendation += `Use: ${fertilizers || cropInfo.fertilizers.join(', ')}.`;

        // Update Result UI
        resultDiv.innerHTML = `
          <h3 style="margin-top:0;">${location} (${crop})</h3>
          <p>pH: ${soil_pH.toFixed(1)}</p>
          <p>${recommendation}</p>
        `;
        resultDiv.className = 'result-success'; // Reset class
        resultDiv.style.display = 'block';

        // Map Logic
        if (map) map.remove();
        soilMapDiv.style.display = 'block';
        map = L.map('soilMap').setView([latitude, longitude], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        L.marker([latitude, longitude]).addTo(map).bindPopup(location).openPopup();
        
        setTimeout(() => map.invalidateSize(), 100);

        showModal(recommendation);

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = `<p class="result-error">Error fetching data.</p>`;
        resultDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Predict Fertilizer';
        loading.style.display = 'none';
      }
    });

    // --- 5. AI Chatbox Logic (Updated for Backend) ---
    function toggleAIChat() {
      const box = document.getElementById("aiChatBox");
      const input = document.getElementById("aiInput");
      if (box.style.display === "flex") {
        box.style.display = "none";
      } else {
        box.style.display = "flex";
        setTimeout(() => input.focus(), 100); // Auto-focus input
      }
    }

    // Enter key to send
    document.getElementById("aiInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendAIMessage();
      }
    });

    async function sendAIMessage() {
      const input = document.getElementById("aiInput");
      const message = input.value.trim();
      const chat = document.getElementById("aiMessages");

      if (!message) return;

      // Add User Message to UI
      chat.innerHTML += `<div class="message user-msg">${message}</div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      // Loading State
      const loadingId = "loading-" + Date.now();
      chat.innerHTML += `<div id="${loadingId}" class="message ai-msg">Thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        // CALL YOUR PYTHON BACKEND HERE
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        // Remove loading and show reply
        document.getElementById(loadingId).remove();
        
        if (data.reply) {
            chat.innerHTML += `<div class="message ai-msg">${data.reply}</div>`;
        } else {
            // Handle error sent from Python
            chat.innerHTML += `<div class="message ai-msg" style="color:red;">Error: ${data.error || "Unknown error"}</div>`;
        }

      } catch (error) {
        document.getElementById(loadingId)?.remove();
        chat.innerHTML += `<div class="message ai-msg" style="color:red;">Connection Error. Is Flask running?</div>`;
        console.error(error);
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
